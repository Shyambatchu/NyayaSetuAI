services:
  - type: web
    name: vidhiverse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false # set after the frontend has a URL, e.g. https://nyayasetu-ai.pages.dev
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///../storage/vidhiverse.db
      - key: SECRET_KEY
        generateValue: true
      - key: GUEST_EXPIRY_DAYS
        value: "30"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM_FALLBACK_PROVIDER
        value: openai_compatible
      - key: LLM_FALLBACK_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_DATA_POLICY
        value: may_train
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_PATH
        value: ../storage
